# The eval dataset: the reference requests of the spec ("Eval sui piani", "Eval strutturate e
# versioning dei prompt"). evals/run.py sends each `request` through the real backend and
# evals/checks.py checks the plan against `expect`. Run a subset with `--tags` (any tag
# matches) or `--ids`.
#
# Rules for every entry (tests/test_eval_requests.py enforces them offline):
# - `request` is a valid backend app.request.PlanRequest: no personal data, ever (agents only
#   get cities, dates, travellers' kinds and ages, budget and free-text preferences).
# - Dates are RELATIVE to the run date (today on the Europe/Rome clock, or `run.py --run-date
#   YYYY-MM-DD`), so they never go stale and always ask for a trip a few weeks ahead, where
#   flight schedules, train timetables and hotel rates are published (far-off dates made the
#   2026-10-12 run find no flights). `run.py` resolves them once; the resolved dates are what
#   the agents get, what `expect` checks and what the results file records. Write them as:
#     exact_start: {in_weeks: 6, weekday: friday}   # the first Friday on or after run date + 6
#                                                  #   weeks (or `in_days: N`; `weekday` is
#                                                  #   optional)
#     nights: 2                                     # exact_end = exact_start + nights
#   or, for flexible dates, `month: {in_months: 2}` (the calendar month 2 months after the run
#   date's) with `nights`. Pick offsets that put the trip 5 to 14 weeks ahead and keep the
#   weekday the request implies (a weekend starts on a Friday). A literal date still works,
#   quoted, but it will go stale.
# - `expect` repeats the constraints the plan must respect: travellers, budget, the
#   destination (when the user chose it), keyword groups that must appear in the plan text
#   (`must_mention`: every group needs one of its keywords) and keywords that must not appear
#   in any booking (`must_not_book`). Keywords match case- and accent-insensitively at the
#   start of a word ("bambin" matches "bambini", "volo" does not match "tavolo"); give
#   generous synonyms, Italian first, because a missing keyword blocks the PR. Do not write
#   `expect.dates`: it is derived from the resolved request dates (exact start and end, or
#   month and nights).
# - The dataset grows: every real plan that goes wrong becomes a new entry (spec).

version: 1

requests:
  - id: city-weekend-lisbon
    title: Weekend in città europea
    tags: [city, weekend, flights, europe, smoke]
    request:
      origin: Milano
      destination: Lisbona
      dates:
        exact_start: {in_weeks: 6, weekday: friday}
        nights: 2
      travelers:
        - kind: adult
        - kind: adult
      budget_eur: 900
      preferences: >-
        Voli diretti, niente partenze prima delle 8. Cucina locale e almeno un museo,
        quartieri da girare a piedi.
    expect:
      travelers: 2
      budget_eur: 900
      destination_any: [lisbona, lisboa, lisbon]
      must_mention:
        - [museo, musei, museu, museum, mosteiro, monastero]
        - [cucina locale, cucina portoghese, tasca, taberna, mercato, pastel, bacalhau, baccala, ristorante tipico]
      must_not_book: []

  - id: sea-week-family
    title: Settimana al mare con bambini
    tags: [sea, family, children, week]
    request:
      origin: Milano
      destination: Sardegna
      dates:
        exact_start: {in_weeks: 12, weekday: saturday}
        nights: 7
      travelers:
        - kind: adult
        - kind: adult
        - kind: child
          age: 4
        - kind: child
          age: 8
      budget_eur: 3200
      preferences: >-
        Spiaggia sabbiosa con acqua bassa adatta ai bambini (anche fuori stagione), alloggio
        con cucina o mezza pensione, spostamenti brevi dall'alloggio. Traghetto con la nostra
        auto oppure volo più auto a noleggio.
    expect:
      travelers: 4
      budget_eur: 3200
      destination_any: [sardegna, sardinia]
      must_mention:
        - [bambin, famiglia, family, figli]
        - [spiaggia, spiagge, beach, lido, mare]
      must_not_book: []

  - id: suggest-low-budget
    title: Suggeriscimi tu, budget basso
    tags: [suggest, low-budget, weekend, solo]
    request:
      origin: Bologna
      suggest_destination: true
      destination_idea: >-
        Una città d'arte raggiungibile in treno o in autobus, con buon cibo e musei economici.
      dates:
        exact_start: {in_weeks: 5, weekday: friday}
        nights: 2
      travelers:
        - kind: adult
      budget_eur: 250
      preferences: Ostello o B&B semplice va bene. Niente auto.
    expect:
      travelers: 1
      budget_eur: 250
      destination_any: []
      must_mention:
        - [treno, treni, autobus, bus, pullman, frecciarossa, italo, regionale, flixbus]
      must_not_book: [noleggio, autonoleggio, car rental, rent a car]

  - id: train-trip-florence
    title: Viaggio in treno
    tags: [train, italy, long-weekend]
    request:
      origin: Torino
      destination: Firenze
      dates:
        exact_start: {in_weeks: 7, weekday: friday}
        nights: 4
      travelers:
        - kind: adult
        - kind: adult
      budget_eur: 1100
      preferences: >-
        Solo treno, niente aerei e niente auto. Alta velocità con posti vicini. Una gita in
        giornata in Toscana, sempre in treno.
    expect:
      travelers: 2
      budget_eur: 1100
      destination_any: [firenze, florence]
      must_mention:
        - [treno, treni, frecciarossa, italo, trenitalia, alta velocita, regionale]
      must_not_book: [volo, voli, aereo, flight, noleggio, autonoleggio, car rental]

  - id: flexible-dates-budapest
    title: Date flessibili
    tags: [flexible-dates, city, flights, family]
    request:
      origin: Venezia
      destination: Budapest
      dates:
        month: {in_months: 2}
        nights: 4
      travelers:
        - kind: adult
        - kind: adult
        - kind: child
          age: 12
      budget_eur: 1500
      preferences: >-
        Scegliete voi i giorni più convenienti del mese. Terme, cucina ungherese, un giro sul
        Danubio.
    expect:
      travelers: 3
      budget_eur: 1500
      destination_any: [budapest]
      must_mention:
        - [terme, termale, bagni, thermal, szechenyi, gellert, furdo, rudas, lukacs]
        - [danubio, duna, danube]
      must_not_book: []

  - id: suggest-direct-flight-solo
    title: Suggeriscimi tu, volo diretto e paesaggi
    tags: [suggest, flights, solo, long-weekend]
    request:
      origin: Bologna
      suggest_destination: true
      destination_idea: Volo diretto, paesaggi mozzafiato facilmente accessibili.
      dates:
        exact_start: {in_weeks: 7, weekday: friday}
        nights: 4
      travelers:
        - kind: adult
      budget_eur: 700
      preferences: Niente voli prima delle 9, cibo locale sublime.
    expect:
      travelers: 1
      budget_eur: 700
      destination_any: []
      must_mention:
        - [cucina locale, piatti tipici, specialità, ristorante tipico, mercato, guachinche, trattoria, taverna]
        - [parco, sentiero, belvedere, vulcano, montagna, costa, scogliere, panorama, escursione]
      must_not_book: []
