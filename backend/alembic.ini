# Alembic configuration for the Trip Planner backend.
# The database URL is NOT here: migrations/env.py reads DATABASE_URL through app.config.Settings.
# Run from backend/: `uv run alembic upgrade head`, `uv run alembic revision --autogenerate -m "..."`.

[alembic]
script_location = %(here)s/migrations

# <date>_<rev>_<slug>.py, so files sort by creation date.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
timezone = UTC
truncate_slug_length = 40

# Make the `app` package importable from env.py.
prepend_sys_path = %(here)s
path_separator = os

[post_write_hooks]
# New revision files are linted and formatted with the project's ruff.
hooks = ruff_format, ruff_check
ruff_check.type = exec
ruff_check.executable = %(here)s/.venv/bin/ruff
ruff_check.options = check --fix REVISION_SCRIPT_FILENAME
ruff_format.type = exec
ruff_format.executable = %(here)s/.venv/bin/ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

# Logging for the alembic command line (env.py skips it when migrations run in-process).
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
