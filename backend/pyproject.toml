[project]
name = "trip-planner-backend"
version = "0.1.0"
description = "Trip Planner backend: FastAPI service that drives one Managed Agents session per plan."
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "anthropic==1.13.0",
    "asyncpg>=0.32.0",
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    # anthropic 1.13.0's transport. app.ma_client and the tests import it directly
    # (httpx2.MockTransport), so it is declared rather than left to arrive transitively.
    "httpx2>=2.13.1",
    "jsonschema>=4.26.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "sqlalchemy[asyncio]>=2",
    "sse-starlette>=3.5.0",
    "structlog>=26.1.0",
    "tzdata>=2026.5",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.17.0",
    "time-machine>=3.5.1",
]

# An application, not a library: `app` is imported from backend/ (uv run, uvicorn, alembic,
# pytest's pythonpath), never installed as a package.
[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["."]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "UP",    # pyupgrade
    "ASYNC", # flake8-async: blocking calls inside async code
    "C4",    # flake8-comprehensions
    "SIM",   # flake8-simplify
    "PT",    # flake8-pytest-style
    "DTZ",   # flake8-datetimez: instants are always timezone-aware
    "N",     # pep8-naming
    "RUF",   # ruff-specific rules
]

# Typographic characters that are legitimate in Italian user-facing copy.
allowed-confusables = ["–", "’", "‘", "×"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency markers are meant to be called in argument defaults.
extend-immutable-calls = [
    "fastapi.Body",
    "fastapi.Cookie",
    "fastapi.Depends",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Query",
    "fastapi.Security",
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
include = ["app", "tests", "migrations"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
addopts = ["--strict-markers", "--strict-config", "-ra"]
