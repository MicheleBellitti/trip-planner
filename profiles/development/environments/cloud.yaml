# Generated by scripts/render_profiles.py from agents/environment.yaml and agents/profiles.yaml (profile: development).
# Do not edit: change the template, then re-render.
# Environment names are unique per workspace, so each profile has its own.
name: trip-planner-development
description: Trip Planner sandbox shared by the coordinator and its four subagents (development profile).
metadata:
  app: trip-planner
  profile: development
config:
  type: cloud
  # UNRESTRICTED networking is the spec's own fallback (risk table: "web_search / web_fetch
  # bloccati dal networking limited" -> "Ambiente unrestricted"). Under `limited`, the
  # environment's allowed_hosts also filters web_search and web_fetch (docs/managed-agents-notes.md
  # D4), which would leave the subagents with almost no search results. The agents still have
  # no tool that books, pays or writes outside the sandbox. Live probe P5 may bring back
  # `limited`; then set `allow_mcp_servers: true` and list every host the research needs.
  # `allow_mcp_servers` exists only under `limited` (the SDK's unrestricted networking takes no
  # other field): unrestricted networking already reaches the MCP servers.
  networking:
    type: unrestricted
  # No `packages`: the skill scripts (build_link.py, write_result.py) use the Python standard
  # library only.
