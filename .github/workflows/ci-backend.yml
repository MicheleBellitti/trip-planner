# Backend CI on pull requests (CLAUDE.md "CI must pass before merge"; spec "CI/CD e operatività").
# Offline only: no Anthropic key, no Managed Agents session, no travel MCP. Tests use the fake
# client and mocked HTTP; Postgres is a service container.
name: ci-backend

on:
  pull_request:
    paths:
      - "backend/**"
      - "skills/**"
      - "scripts/**"
      - "evals/**"
      - "schema/**"
      - "agents/**"
      - "profiles/**"
      - ".github/workflows/**"
      - ".github/actions/**"
      - ".github/scripts/**"
      # The web's timeline fixtures are generated by the backend's normalizer (checked below).
      - "web/scripts/gen-backend-fixtures.py"
      - "web/lib/plan-events/__fixtures__/backend/**"

permissions:
  contents: read

concurrency:
  group: ci-backend-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.13.0"

defaults:
  run:
    working-directory: backend

jobs:
  checks:
    name: lint, types, generated files, non-backend tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install the locked dependencies
        run: uv sync --locked

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format --check
        run: uv run ruff format --check .

      # The same rules outside backend/. scripts/ has no ruff config of its own: --config gives
      # it backend's. evals/ruff.toml and skills/ruff.toml extend backend's config; skills/
      # targets Python 3.10, the sandbox's Python that runs the skill scripts.
      - name: ruff check (scripts, evals, skills)
        run: |
          uv run ruff check --config pyproject.toml ../scripts
          uv run ruff check ../evals ../skills

      - name: ruff format --check (scripts, evals, skills)
        run: |
          uv run ruff format --check --config pyproject.toml ../scripts
          uv run ruff format --check ../evals ../skills

      - name: pyright
        run: uv run pyright

      # schema/*.json are generated from the Pydantic models; profiles/** is rendered from
      # agents/ (and inlines schema/plan.json into submit_plan). Neither is ever hand-edited.
      - name: schema/ is up to date
        run: uv run python -m app.schemas --check

      - name: profiles/ is up to date
        run: uv run python ../scripts/render_profiles.py --check

      - name: Skill, script and eval tests (no Postgres, no network)
        run: uv run pytest ../skills ../scripts ../evals/tests -q

      # web/lib/plan-events/__fixtures__/backend/ is what app.events.normalize makes of the
      # scripted sessions in tests/fixtures/ma/: the web reducer's tests read it, so a change
      # to the UI event vocabulary fails here until the fixtures (and the web) follow.
      - name: Web timeline fixtures match the backend's UI events
        run: uv run python ../web/scripts/gen-backend-fixtures.py --check

  tests:
    name: pytest (Postgres 16)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: trip_planner
          POSTGRES_PASSWORD: trip_planner
          POSTGRES_DB: trip_planner_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trip_planner -d trip_planner_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # conftest creates the database if missing and rebuilds it from the migrations.
      TEST_DATABASE_URL: postgresql+asyncpg://trip_planner:trip_planner@localhost:5432/trip_planner_test
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install the locked dependencies
        run: uv sync --locked

      - name: pytest
        run: uv run pytest

  workflows:
    name: workflow lint and Anthropic-credentials guard
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false

      # actionlint runs shellcheck on every `run:` block; shellcheck ships with the runner image.
      # -ignore: actionlint 1.7.12 doesn't know concurrency's `queue` key yet (evals.yml uses
      # it); drop the flag once a release accepts it.
      - name: actionlint
        run: uvx --from actionlint-py==1.7.12.25 actionlint -color -ignore 'unexpected key "queue" for "concurrency" section'

      # Anthropic credentials must be unreachable from outside the intended jobs (spec "CI/CD e
      # operatività"). CI authenticates in one of two modes (docs/deploy.md, "Anthropic
      # credentials in CI"): Workload Identity Federation, or the ANTHROPIC_API_KEY secret of
      # the job's GitHub environment, both through .github/actions/anthropic-auth. GitHub
      # enforces the environment side: `production` accepts only `main` and needs Michele's
      # approval, so a pull request can reach the development credentials and never the
      # production ones. This guard keeps the workflows from drifting away from that design:
      # see the rules at the top of .github/scripts/check_anthropic_credentials.py (no
      # pull_request_target; no production job in a PR-run workflow; every job that uses the
      # action, the secret or id-token declares an environment; the secret only as the action's
      # api-key input; no retired per-environment key names; no ANTHROPIC_API_KEY in an
      # env:). Its self-test proves that each rule fails on a minimal workflow that breaks it.
      - name: Anthropic credentials stay out of pull requests
        run: |
          uv run --no-project --with pyyaml==6.0.3 python .github/scripts/check_anthropic_credentials.py
          uv run --no-project --with pyyaml==6.0.3 python .github/scripts/check_anthropic_credentials.py --self-test
